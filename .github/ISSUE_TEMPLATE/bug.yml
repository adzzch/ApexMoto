name: Error
description: Algo no funciona como debería
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Para vulnerabilidades **no uses este formulario**: sigue SECURITY.md. No pegues claves, tokens ni datos personales.
  - type: textarea
    id: que-pasa
    attributes:
      label: Qué pasa
      description: Qué esperabas y qué ocurrió.
    validations:
      required: true
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducirlo
      placeholder: "1. Entro como Rider\n2. …"
    validations:
      required: true
  - type: dropdown
    id: rol
    attributes:
      label: Rol
      options: [Rider, Guía de rutas, Comercio, Taller mecánico, Dueño de moto, No aplica]
  - type: input
    id: entorno
    attributes:
      label: Entorno
      description: Versión de la app, dispositivo o emulador y versión de Android.
      placeholder: "1.1 · Pixel 7 · Android 14"
  - type: textarea
    id: registro
    attributes:
      label: Capturas o registro
      description: Capturas de pantalla o Logcat (sin datos personales).
